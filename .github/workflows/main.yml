name: CI Build and Test

on:
  push:
    branches:
      - develop
      - master
  pull_request:
    branches:
      - develop
      - master

jobs:
  UnitTests:
    name: Unit Tests
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Run Unit Tests
        run: mvn --batch-mode test

  Build:
    name: Build and Run Docker Compose
    needs: UnitTests
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Package Application
        run: mvn --batch-mode package -DskipTests

      - name: Run Docker Compose
        run: docker compose up --build --abort-on-container-exit --exit-code-from app

      - name: Clean Up
        if: always()
        run: docker compose down --remove-orphans