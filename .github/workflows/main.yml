name: A workflow for my Hello World App

on: push

jobs:
  build:
    name: Hello world action
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'

      - name: Setup Docker network and MongoDB
        run: |
          docker network create --driver bridge se-methods
          docker pull mongo
          docker run -d \
            --name mongo-dbserver \
            --network se-methods \
            mongo

      - name: Build with Maven
        run: mvn clean package

      - name: Build Docker image
        run: docker build -t se_methods .

      - name: Run image
        run: docker run --network se-methods --name semcontainer se_methods

      - name: View logs
        if: always()
        run: docker logs semcontainer
